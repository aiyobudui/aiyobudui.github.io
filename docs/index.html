    <!-- docsify 配置 -->
    <script>
        window.$docsify = {
            // 基础配置
            el: '#app',
            homepage: 'home.md',
            name: '对酒当歌分享',
            nameLink: '/',
            logo: '',
            repo: '',

            // 侧边栏配置
            loadSidebar: '_sidebar.md',
            subMaxLevel: 0,
            maxLevel: 3,
            autoHeader: false,

            // 页面行为
            auto2top: false, // 关闭：否则每次切换页面强制回顶，会覆盖搜索结果「定位到标题」的默认跳转（docsify 默认即 false）
            coverpage: false,
            onlyCover: false,
            noEmoji: true,
            routerMode: 'hash',
            relativePath: false,
            externalLinkTarget: '_blank',
            catchPluginErrors: true,

            // 404 页面
            notFoundPage: '404.md',

            // 请求与链接
            noCompileLinks: [
                '^https://pan\\.quark\\.cn/s/',
                '^https://pan\\.xunlei\\.com/s/',
                '^https://pan\\.baidu\\.com/s/',
                '^https://www\\.aliyundrive\\.com/s/'
            ],
            alias: {
                '/zh-cn/_sidebar.md': '/_sidebar.md',
                '/.*/_sidebar.md': '/_sidebar.md'
            },

            // 插件配置

            // @alertbox/docsify-footer 插件
            loadFooter: '_footer.md',

            // docsify 搜索插件（v5）
            search: {
                paths: 'auto',
                maxAge: 86400000,
                placeholder: '请输入关键词"搜索"',
                noData: '没有搜到就换个关键词在试试。没有就联系站长让他上资源。',
                depth: 4,
                namespace: 'web-v2',
                pathNamespaces: ['/zh-cn'],
                // 将搜索框放到标题栏(.app-name)下方，而非默认的侧边栏最顶部
                insertAfter: '.app-name',
            },

            // 自定义插件
            plugins: [
                function (hook, vm) {
                    // 记录用户已展开的分组（按 href 标识），切换页面后保持展开状态
                    if (!window.__expandedGroups) window.__expandedGroups = new Set();

                    // 每次页面切换后执行（包含首次加载）
                    hook.doneEach(function () {
                        // 修复手机菜单显示问题
                        setTimeout(function () {
                            if (typeof toggleMobileNav === 'function') {
                                toggleMobileNav();
                            }
                        }, 100);

                        // 初始化Waline
                        if (typeof initWaline === 'function') {
                            initWaline();
                        }

                        // 侧边栏分组：默认收起，点击父级链接可展开/折叠
                        // 用自定义委托处理器（捕获阶段）切换 .collapse 类，
                        // 避免依赖官方 handler 的结构假设，并阻止其重复触发。
                        var sidebarNav = document.querySelector('.sidebar-nav');
                        if (sidebarNav) {
                            // 全局展开/折叠处理器（只绑一次）
                            if (!sidebarNav.dataset.collapseBound) {
                                sidebarNav.dataset.collapseBound = '1';
                                sidebarNav.addEventListener('click', function (e) {
                                    var a = e.target.closest('a');
                                    if (!a) return;
                                    var li = a.parentElement;
                                    if (li && li.tagName === 'LI' && li.querySelector(':scope > ul')) {
                                        e.stopPropagation(); // 阻止官方 collapse 处理器重复切换
                                        var key = a.getAttribute('href') || a.textContent.trim();
                                        var willOpen = li.classList.contains('collapse');
                                        // 手风琴：展开前先收起所有其它父级
                                        if (willOpen) {
                                            sidebarNav.querySelectorAll('li').forEach(function (other) {
                                                if (other !== li && other.tagName === 'LI' && other.querySelector(':scope > ul')) {
                                                    other.classList.add('collapse');
                                                }
                                            });
                                            window.__expandedGroups.clear();
                                        }
                                        if (li.classList.contains('collapse')) {
                                            li.classList.remove('collapse');
                                            window.__expandedGroups.add(key);
                                        } else {
                                            li.classList.add('collapse');
                                            window.__expandedGroups.delete(key);
                                        }
                                    }
                                }, true); // 捕获阶段，先于官方冒泡处理器执行
                            }

                            // 应用折叠状态：已展开的分组保持展开，其余默认收起
                            sidebarNav.querySelectorAll('li').forEach(function (li) {
                                var a = li.querySelector(':scope > a');
                                var hasChildUl = li.querySelector(':scope > ul');
                                if (a && hasChildUl) {
                                    var key = a.getAttribute('href') || a.textContent.trim();
                                    if (window.__expandedGroups.has(key)) {
                                        li.classList.remove('collapse');
                                    } else {
                                        li.classList.add('collapse');
                                    }
                                }
                            });
                        }

                        // 正文内 TOC：抓取当前页 h2，注入「本页目录」卡片到正文顶部
                        buildInContentToc();

                    });
                }
            ]
        }
    </script>

    <script>var __savedPlugins = window.$docsify.plugins || [];</script>

        onerror="document.write('<script src=\'https://unpkg.com/docsify@5.0.0/dist/plugins/search.min.js\'><\/script>')"></script>

    <script>window.$docsify.plugins = window.$docsify.plugins.concat(__savedPlugins);</script>
