    <script>
        // 性能监控数据收集
        window.perfMonitor = {
            data: {
                jsLoadTimes: {},
                navigationStart: performance.now()
            },
            // 记录JS加载时间
            logJsLoad: function(name, startTime) {
                var duration = performance.now() - startTime;
                this.data.jsLoadTimes[name] = duration;
                console.log('[性能监控] ' + name + ' 加载时间: ' + duration.toFixed(2) + 'ms');
            },
            // 输出报告
            report: function() {
                console.log('========== 性能监控报告 ==========');
                console.log('JS加载时间:', this.data.jsLoadTimes);
                console.log('页面总耗时:', (performance.now() - this.data.navigationStart).toFixed(2) + 'ms');
                console.log('==================================');
            }
        };

        // 监控各阶段加载时间
        window.addEventListener('load', function() {
            setTimeout(function() {
                var timing = performance.timing;
                console.log('[性能监控] 页面加载时间统计:');
                console.log('  DNS查询: ' + (timing.domainLookupEnd - timing.domainLookupStart) + 'ms');
                console.log('  TCP连接: ' + (timing.connectEnd - timing.connectStart) + 'ms');
                console.log('  请求响应: ' + (timing.responseEnd - timing.requestStart) + 'ms');
                console.log('  DOM解析: ' + (timing.domComplete - timing.domLoading) + 'ms');
                console.log('  总加载时间: ' + (timing.loadEventEnd - timing.navigationStart) + 'ms');
            }, 0);
        });
    </script>

    <style>
        /* =================== 1. CSS变量定义 =================== */
        :root {
            --base-font-size: 0.9375rem;
            /* 基础字体大小 */
            --sidebar-width: 20.5rem;
            /* 侧边栏宽度 */
            --sidebar-nav-margin: 1rem 0.1rem 0.1rem;
            /* 侧边栏导航外边距 */
            --primary-color: #4155c4;
            /* 主色调 */
            --secondary-color: #5e72e4;
            /* 次要色调 */
            --accent-color: #fed24a;
            /* 强调色 */
            --shadow-color: rgba(50, 50, 93, 0.1);
            /* 阴影颜色 */
            --docsifytabs-border-color: #ededed;
            /* 选项卡边框颜色 */
            --docsifytabs-tab-highlight-color: purple;
            /* 选项卡高亮颜色 */
            --heading-color: var(--primary-color);
            /* 标题颜色 */
            --content-margin-inline: 1.25rem;
            /* 内容内边距 */

            /* Emoji 字体栈 - 确保跨平台一致性 */
            --emoji-font: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            /* 内容最大宽度 - 使用clamp()函数实现响应式宽度 */
            --content-max-width: clamp(60ch, 80vw, 110ch);
        }

        /* =================== 滚动偏移量设置 =================== */
        /* 为所有标题设置滚动偏移量，确保滚动后不会被导航栏遮挡 */

        .markdown-section h2,
        .markdown-section h3,
        .markdown-section h4 {
            scroll-margin-top: 100px; /* 为导航栏留出空间 */
        }

        /* 手机端特殊处理 */
        @media screen and (max-width: 767px) {
            .markdown-section h1,
            .markdown-section h2,
            .markdown-section h3,
            .markdown-section h4 {
                scroll-margin-top: 150px; /* 为手机导航栏留出更多空间 */
            }
        }

        /* =================== 2. 图片懒加载 =================== */
        .lazy-load {
            opacity: 0;
            /* 初始透明度为0，隐藏图片 */
            transition: opacity 0.3s ease-in-out;
            /* 透明度过渡动画 */
        }

        .lazy-load.loaded {
            opacity: 1;
            /* 加载完成后显示图片 */
        }

        /* =================== 3. 页面加载动画 =================== */
        #app {
            display: flex;
            /* 使用flex布局 */
            align-items: center;
            /* 垂直居中 */
            justify-content: center;
            /* 水平居中 */
            min-height: 100vh;
            /* 最小高度为视口高度 */
            font-size: clamp(1.5rem, 8vw, 2.375rem);
            /* 响应式字体大小 */
        }

        /* Docsify 加载完成后的样式 */
        #app:not(:has(.loading-text)) {
            display: block;
            /* 取消flex布局，让内容正常显示 */
            min-height: 100vh;
            /* 最小高度为视口高度 */
        }

        /* 加载文字点的动画关键帧 */
        @keyframes dot-animation {

            0%,
            50% {
                opacity: 0.2;
                /* 半透明 */
            }

            25%,
            75% {
                opacity: 1;
                /* 完全不透明 */
            }

            100% {
                opacity: 0.2;
                /* 回到半透明 */
            }
        }

        .loading-text {
            display: inline-block;
            /* 行内块元素 */
            font-weight: bold;
            /* 加粗字体 */
        }

        .loading-text span {
            display: inline-block;
            animation: dot-animation 1.5s infinite ease-in-out;
            /* 无限循环动画 */
            margin: 0 2px;
            /* 点之间的间距 */
        }

        /* 每个点的动画延迟，实现波浪效果 */
        .loading-text span:nth-child(1) {
            animation-delay: 0.1s;
        }

        .loading-text span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .loading-text span:nth-child(3) {
            animation-delay: 0.5s;
        }

        .loading-text span:nth-child(4) {
            animation-delay: 0.7s;
        }

    <!-- =================== 手机菜单修复函数 =================== -->
    <script>
        // 增强的手机菜单显示函数
        function toggleMobileNav() {
            requestAnimationFrame(function() {
                var mobileNav = document.querySelector('.mobile-nav');
                if (mobileNav) {
                    var isMobile = window.innerWidth <= 767 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    if (isMobile) {
                        mobileNav.classList.add('force-show');
                        document.body.style.paddingBottom = mobileNav.offsetHeight + 'px';
                    } else {
                        mobileNav.classList.remove('force-show');
                        document.body.style.paddingBottom = '';
                    }
                }
            });
        }

        // 公共函数：检测是否为移动设备
        function isMobileDevice() {
            return window.innerWidth <= 767 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // 页面加载完成后显示手机菜单
        window.addEventListener('load', toggleMobileNav);
        window.addEventListener('resize', function() {
            setTimeout(toggleMobileNav, 100);
        });
        window.addEventListener('pageshow', toggleMobileNav);
    </script>

    <!-- 处理哈希路由滚动 -->
    <script>
        // 处理哈希路由滚动
        function handleHashScroll() {
            var hash = window.location.hash;
            if (hash && hash.startsWith('#')) {
                // 提取查询参数中的id
                var targetId = '';
                
                // 查找查询参数部分
                var queryIndex = hash.indexOf('?');
                if (queryIndex > -1) {
                    // 从查询参数中提取id
                    var queryString = hash.substring(queryIndex + 1);
                    if (queryString) {
                        // 手动解析查询参数，处理URL编码
                        var params = {};
                        queryString.split('&').forEach(function(param) {
                            var parts = param.split('=');
                            if (parts.length === 2) {
                                params[parts[0]] = decodeURIComponent(parts[1]);
                            }
                        });
                        targetId = params.id;
                    }
                } else {
                    // 直接使用哈希值作为id
                    targetId = hash.substring(1);
                }
                
                if (targetId) {
                    // 多次尝试查找元素，确保DOM完全加载
                    var findElementAttempts = 0;
                    var maxAttempts = 5;
                    
                    function findAndScroll() {
                        findElementAttempts++;
                        
                        // 尝试查找目标元素
                        var targetElement = null;
                        
                        // 1. 直接使用id查找
                        if (!targetElement) {
                            targetElement = document.getElementById(targetId);
                        }
                        
                        // 2. 使用name属性查找
                        if (!targetElement) {
                            targetElement = document.querySelector('a[name="' + targetId + '"]');
                        }
                        
                        // 3. 查找标题元素（h1-h6）
                        if (!targetElement) {
                            var headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
                            for (var i = 0; i < headings.length; i++) {
                                var heading = headings[i];
                                if (heading.id === targetId || heading.getAttribute('name') === targetId) {
                                    targetElement = heading;
                                    break;
                                }
                            }
                        }
                        
                        // 4. 查找所有带id的元素
                        if (!targetElement) {
                            var allElements = document.querySelectorAll('[id]');
                            for (var j = 0; j < allElements.length; j++) {
                                var element = allElements[j];
                                if (element.id === targetId) {
                                    targetElement = element;
                                    break;
                                }
                            }
                        }
                        
                        if (targetElement) {
                            // 等待一小段时间确保元素完全渲染
                            setTimeout(function() {
                                // 强制滚动到元素顶部
                                var rect = targetElement.getBoundingClientRect();
                                var scrollPosition = window.pageYOffset + rect.top;
                                
                                // 立即滚动到目标位置
                                window.scrollTo(0, scrollPosition);
                                
                                // 再次修正滚动位置
                                setTimeout(function() {
                                    var newRect = targetElement.getBoundingClientRect();
                                    if (newRect.top !== 0) {
                                        window.scrollBy(0, -newRect.top);
                                    }
                                }, 200);
                            }, 100);
                        } else if (findElementAttempts < maxAttempts) {
                            // 继续尝试查找元素
                            setTimeout(findAndScroll, 1000);
                        }
                    }
                    
                    // 开始查找元素
                    findAndScroll();
                }
            }
        }

        // 只在搜索结果点击时处理哈希滚动
        // 移除了全局哈希变化和页面加载时的调用，避免干扰微前端路由
    </script>

    <!-- 手机端底部导航栏交互 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var mobileNavMore = document.getElementById('mobileNavMore');
            var mobileNavPopup = document.getElementById('mobileNavPopup');
            var mobileNavSearch = document.getElementById('mobileNavSearch');
            var mobileSearchInput = document.getElementById('mobileSearchInput');
            var mobileSearchBtn = document.getElementById('mobileSearchBtn');
            var submenuItems = document.querySelectorAll('.mobile-nav-has-submenu');

            // 关闭所有菜单的通用函数
            function closeAllMenus(exclude) {
                document.querySelectorAll('.mobile-nav-submenu, .mobile-nav-more-popup, .mobile-nav-search-popup').forEach(function (menu) {
                    if (menu !== exclude) menu.classList.remove('show');
                });
            }

            // 点击更多按钮切换弹出菜单
            if (mobileNavMore && mobileNavPopup) {
                mobileNavMore.onclick = function (e) {
                    e.stopPropagation();
                    closeAllMenus(mobileNavPopup);
                    mobileNavPopup.classList.toggle('show');
                };

                // 使用事件委托处理弹出菜单中的链接点击
                mobileNavPopup.addEventListener('click', function (e) {
                    if (e.target.tagName === 'A' || e.target.closest('a')) {
                        mobileNavPopup.classList.remove('show');
                    }
                });
            }

            // 点击搜索按钮
            var mobileSearchOverlay = document.getElementById('mobileSearchOverlay');
            var mobileSearchClose = document.getElementById('mobileSearchClose');
            var mobileSearchResults = document.getElementById('mobileSearchResults');

            // HTML转义
            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 显示搜索结果
            function displaySearchResults(results, keyword) {
                if (!mobileSearchResults) return;

                if (!results || results.length === 0) {
                    mobileSearchResults.innerHTML = '<div class="mobile-search-no-results"><svg><use href="#icon-inbox"/></svg> 没有找到相关结果</div>';
                    mobileSearchResults.classList.add('has-content');
                    return;
                }

                var html = '';
                results.forEach(function (result) {
                    var path = result.path || result.url || '#';
                    var title = result.title || '未命名';
                    
                    var hashPath = path;
                    if (!hashPath.startsWith('#')) {
                        if (!hashPath.startsWith('/')) {
                            hashPath = '/' + hashPath;
                        }
                        hashPath = '#' + hashPath;
                    }
                    
                    html += '<a href="' + escapeHtml(hashPath) + '" class="mobile-search-result-item" data-search-result>' +
                        '<svg><use href="#icon-file-alt"/></svg>' +
                        '<span class="mobile-search-result-title">' + escapeHtml(title) + '</span>' +
                        '<svg style="color: #ccc; font-size: 0.75rem;"><use href="#icon-chevron-right"/></svg>' +
                        '</a>';
                });
                mobileSearchResults.innerHTML = html;
                mobileSearchResults.classList.add('has-content');

                // 搜索结果点击事件处理
                document.querySelectorAll('[data-search-result]').forEach(function (link) {
                    link.addEventListener('click', function (e) {
                        // 关闭搜索遮罩和清空输入框
                        closeSearchOverlay();
                        mobileSearchInput.value = '';
                        
                        // 延迟执行哈希滚动处理，确保页面已经切换
                        setTimeout(function() {
                            handleHashScroll();
                        }, 300);
                    });
                });


            }

            // 侧边栏搜索 - 遍历侧边栏链接查找匹配项
            function doSidebarSearch(keyword) {
                var lowerKeyword = keyword.toLowerCase();
                var results = [];

                try {
                    var links = document.querySelectorAll('.sidebar-nav a, .sidebar a');

                    links.forEach(function (link) {
                        var text = (link.textContent || '').toLowerCase();
                        var href = link.getAttribute('href') || '';

                        if (text.indexOf(lowerKeyword) !== -1 && href && href !== '#') {
                            results.push({
                                title: link.textContent.trim(),
                                path: href
                            });
                        }
                    });

                    if (results.length > 0) {
                        displaySearchResults(results, keyword);
                    } else {
                        mobileSearchResults.innerHTML = '<div class="mobile-search-no-results"><svg><use href="#icon-inbox"/></svg> 没有找到相关结果</div>';
                        mobileSearchResults.classList.add('has-content');
                    }
                } catch (e) {
                    mobileSearchResults.innerHTML = '<div class="mobile-search-no-results"><svg><use href="#icon-inbox"/></svg> 搜索出错</div>';
                    mobileSearchResults.classList.add('has-content');
                }
            }

            // 执行搜索 - 手机端搜索实现
            function doSearch(keyword) {
                // 步骤1: 触发 Docsify 搜索框（展开侧边栏显示匹配标题）
                try {
                    var searchInput = document.querySelector('.search input[type="search"]');
                    if (searchInput) {
                        searchInput.value = keyword;
                        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                } catch (e) {
                    // 搜索框触发失败，静默处理
                }

                // 步骤2: 延迟后搜索侧边栏（给时间让搜索框展开侧边栏）
                setTimeout(function () {
                    doSidebarSearch(keyword);
                }, 500);
            }

            // 搜索功能
            function performSearch(keyword) {
                if (!keyword || !mobileSearchResults) return;

                // 显示加载中
                mobileSearchResults.innerHTML = '<div class="mobile-search-loading"><svg class="icon-spin"><use href="#icon-spinner"/></svg> 搜索中...</div>';

                // 延迟执行，确保DOM就绪
                setTimeout(function () {
                    doSearch(keyword);
                }, 100);
            }

            // 关闭搜索遮罩
            function closeSearchOverlay() {
                if (mobileSearchOverlay) {
                    mobileSearchOverlay.classList.remove('show');
                }
                if (mobileSearchResults) {
                    mobileSearchResults.innerHTML = '';
                    mobileSearchResults.classList.remove('has-content');
                }
                // 移除body上的search-active类，恢复TOC显示
                document.body.classList.remove('search-active');
            }

            if (mobileNavSearch && mobileSearchOverlay) {
                mobileNavSearch.onclick = function (e) {
                    e.stopPropagation();
                    closeAllMenus();
                    mobileSearchOverlay.classList.add('show');
                    document.body.classList.add('search-active');
                    if (mobileSearchInput) {
                        mobileSearchInput.focus();
                    }
                    if (mobileSearchResults) {
                        mobileSearchResults.innerHTML = '';
                        mobileSearchResults.classList.remove('has-content');
                    }
                };

                if (mobileSearchClose) {
                    mobileSearchClose.onclick = function (e) {
                        e.stopPropagation();
                        closeSearchOverlay();
                    };
                }

                // 点击遮罩背景阻止事件冒泡
                if (mobileSearchOverlay) {
                    mobileSearchOverlay.onclick = function (e) {
                        if (e.target.closest('.mobile-search-close')) return;
                        if (e.target === mobileSearchOverlay) {
                            closeSearchOverlay();
                        }
                        e.stopPropagation();
                    };
                }

                // 搜索按钮点击事件
                if (mobileSearchBtn) {
                    mobileSearchBtn.onclick = function (e) {
                        e.stopPropagation();
                        var keyword = mobileSearchInput ? mobileSearchInput.value.trim() : '';
                        if (keyword) {
                            performSearch(keyword);
                        }
                    };
                }

                // 输入框事件（支持回车搜索）
                if (mobileSearchInput) {
                    mobileSearchInput.onkeydown = function (e) {
                        if (e.key === 'Enter') {
                            var keyword = mobileSearchInput.value.trim();
                            if (keyword) {
                                performSearch(keyword);
                            }
                        }
                        // ESC键关闭
                        if (e.key === 'Escape') {
                            closeSearchOverlay();
                        }
                    };
                }
            }

            // 点击有子菜单的项
            submenuItems.forEach(function (item) {
                item.onclick = function (e) {
                    e.stopPropagation();
                    var submenuId = 'submenu-' + item.getAttribute('data-submenu');
                    var submenu = document.getElementById(submenuId);

                    if (submenu) {
                        closeAllMenus(submenu);
                        submenu.classList.toggle('show');
                    }
                };
            });

            // 点击其他地方关闭所有菜单
            document.addEventListener('click', function (e) {
                // 如果搜索遮罩显示
                if (mobileSearchOverlay && mobileSearchOverlay.classList.contains('show')) {
                    // 如果点击的是关闭按钮，允许关闭
                    if (e.target.closest('.mobile-search-close')) {
                        closeSearchOverlay();
                        return;
                    }
                    // 如果点击遮罩外部，阻止事件
                    if (!e.target.closest('.mobile-search-overlay')) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                    return;
                }

                if (!e.target.closest('.mobile-nav') && !e.target.closest('.mobile-search-overlay')) {
                    closeAllMenus();
                }
            }, true);

            // 使用事件委托处理子菜单中的链接点击
            document.addEventListener('click', function (e) {
                if (e.target.closest('.mobile-nav-submenu a')) {
                    closeAllMenus();
                }
            });

            // 更新当前激活的导航项
            function updateActiveNav() {
                var currentPath = window.location.pathname;
                var navItems = document.querySelectorAll('.mobile-nav-item[data-path]');

                navItems.forEach(function (item) {
                    var itemPath = item.getAttribute('data-path');
                    if (currentPath === itemPath || currentPath.startsWith(itemPath + '/')) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }

            updateActiveNav();

            window.addEventListener('popstate', updateActiveNav);
            window.addEventListener('hashchange', updateActiveNav);

            if (typeof docsify !== 'undefined' && docsify.hooks) {
                docsify.hooks.doneEach(function () {
                    updateActiveNav();
                });
            }
        });
    </script>



    <script type="text/javascript">
        // 更精确的时间计算函数
        function calculateRunTime() {
            var startDate = new Date(2024, 3, 3, 21, 0, 0);
            var now = new Date();
            var diff = now - startDate;

            var seconds = Math.floor(diff / 1000) % 60;
            var minutes = Math.floor(diff / (1000 * 60)) % 60;
            var hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            var days = Math.floor(diff / (1000 * 60 * 60 * 24));
            var years = Math.floor(days / 365);
            var remainingDays = days % 365;
            return {
                years: years,
                days: remainingDays,
                hours: hours,
                minutes: minutes,
                seconds: seconds
            };
        }

        function updateSiteTime() {
            var timeInfo = calculateRunTime();
            var timeElement = document.getElementById("sitetime");

            if (timeElement) {
                timeElement.innerHTML = '本网站已运行 ' + timeInfo.years + '年 ' + timeInfo.days + '天 ' + timeInfo.hours + '时 ' + timeInfo.minutes + '分 ' + timeInfo.seconds + '秒';
            }
        }

        var siteTimeInterval = setInterval(updateSiteTime, 1000);

        if (document.readyState === "complete") {
            updateSiteTime();
        } else {
            window.addEventListener("load", function() {
                updateSiteTime();
            });
        }

        window.addEventListener('beforeunload', function() {
            clearInterval(siteTimeInterval);
        });
    </script>

    <!-- JS插件加载性能监控（仅调试模式启用） -->
    <script>
        if (location.search.includes('debug')) {
            (function () {
                window.scriptLoadTimes = {};

                var originalAppendChild = Element.prototype.appendChild;
                Element.prototype.appendChild = function (element) {
                    if (element.tagName === 'SCRIPT' && element.src) {
                        var scriptName = element.src.split('/').pop() || element.src;
                        var startTime = performance.now();

                        console.log('[性能监控] 开始加载: ' + scriptName);

                        element.addEventListener('load', function () {
                            var loadTime = (performance.now() - startTime).toFixed(2);
                            window.scriptLoadTimes[scriptName] = loadTime;
                            console.log('[性能监控] 加载完成: ' + scriptName + ' - ' + loadTime + 'ms');
                        });

                        element.addEventListener('error', function () {
                            console.error('[性能监控] 加载失败: ' + scriptName);
                        });
                    }
                    return originalAppendChild.apply(this, arguments);
                };

                window.addEventListener('load', function () {
                    setTimeout(function () {
                        console.log('%c[性能监控] JS插件加载时间汇总:', 'color: #2196F3; font-size: 14px; font-weight: bold;');

                        var sortedScripts = Object.entries(window.scriptLoadTimes)
                            .sort(function (a, b) { return b[1] - a[1]; });

                        if (sortedScripts.length === 0) {
                            console.log('[性能监控] 未检测到动态加载的脚本');
                        } else {
                            sortedScripts.forEach(function (item) {
                                var time = parseFloat(item[1]);
                                var color = time > 1000 ? '#f44336' : time > 500 ? '#ff9800' : '#4caf50';
                                console.log('%c  ' + item[0] + ': ' + item[1] + 'ms', 'color: ' + color);
                            });
                        }

                        if (window.performance && window.performance.getEntriesByType) {
                            var resources = window.performance.getEntriesByType('resource');
                            var scripts = resources.filter(function (r) {
                                return r.initiatorType === 'script' || r.name.endsWith('.js');
                            });

                            if (scripts.length > 0) {
                                console.log('%c[性能监控] 所有JS资源加载时间 (Performance API):', 'color: #2196F3; font-size: 14px; font-weight: bold;');

                                scripts.sort(function (a, b) { return b.duration - a.duration; });

                                scripts.forEach(function (script) {
                                    var name = script.name.split('/').pop();
                                    var time = script.duration.toFixed(2);
                                    var color = script.duration > 1000 ? '#f44336' : script.duration > 500 ? '#ff9800' : '#4caf50';
                                    console.log('%c  ' + name + ': ' + time + 'ms', 'color: ' + color);
                                });
                            }
                        }
                    }, 1000);
                });
            })();
        }
    </script>
